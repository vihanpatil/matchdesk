name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Section 9.5: red CI blocks everything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / license / test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: License audit
        run: pnpm license:audit

      - name: Unit + property tests with coverage gates
        run: pnpm test:cov

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  mutation:
    name: mutation score (packages/core)
    runs-on: ubuntu-latest
    # Measured 2026-08-17: ~22 min locally on Apple Silicon at 1135 tests,
    # slower on this runner — the old 30-minute cap killed the job mid-run
    # (H-121). This is a ceiling against hangs, not a target; it grows with
    # the suite.
    timeout-minutes: 60
    # Separate job, not part of `verify`: it takes ~8.5 min, which is too slow
    # to sit in front of every commit, but it is the only check that measures
    # whether the tests are REAL rather than whether lines ran (ADR-020).
    steps:
      - uses: actions/checkout@v4
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Mutation test
        run: pnpm mutate
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
